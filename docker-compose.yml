services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lar
      POSTGRES_USER: lar
      POSTGRES_PASSWORD: lar
      TZ: Europe/Lisbon
    volumes:
      - dados-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lar -d lar"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"          # publicado em todas as interfaces (0.0.0.0)
    environment:
      TZ: Europe/Lisbon
      SPRING_PROFILES_ACTIVE: demo
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/lar
      SPRING_DATASOURCE_USERNAME: lar
      SPRING_DATASOURCE_PASSWORD: lar
      # Para a demo mostrar medicação em atraso de manhã cedo, descomentar:
      # LAR_HORARIOS_MANHA: "06:00"
  
  adminer:
    image: adminer
    ports:
      - "8081:8080"
    depends_on:
      - db
    profiles: ["tools"]

volumes:
  dados-db:
