server:
  address: 0.0.0.0
  port: 8080

spring:
  application:
    name: gestao-lar
  datasource:
    url: jdbc:postgresql://localhost:5432/lar
    username: lar
    password: lar
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  web:
    locale: pt_PT
    resources:
      cache:
        period: 0
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  thymeleaf:
    cache: false

management:
  endpoints:
    web:
      exposure:
        include: health

lar:
  nome: AMS                    # mostrado na barra superior do tablet (LAR_NOME)
  fuso: Europe/Lisbon
  # Horários fixos das tomas. Podem ser alterados por variável de ambiente (ex.: LAR_HORARIOS_MANHA=06:00).
  horarios:
    MANHA: "09:00"
    ALMOCO: "13:00"
    JANTAR: "19:00"
    DEITAR: "22:00"
  atraso-minutos: 60
  ocorrencia-horas: 48
  # Registos que exigem sessão de PIN (editável no /admin → Definições; o valor guardado lá prevalece).
  # toma=true é obrigatório enquanto o painel de Medicação exigir sessão: com false continua a pedir PIN.
  registo:
    exige-sessao:
      # O banho nunca exige sessão (regra fixa, não configurável); só ocorrências e medicação.
      ocorrencia: true      # queda e dor
      toma: true
      refeicao: false       # a refeição regista-se sem PIN
      peso: true            # o peso (separador Saúde) exige sempre PIN
  sessao:
    minutos: 2              # duração da sessão depois da última interação
  # Refeições: hora a que começa cada janela. A refeição de um registo é a última janela que já começou
  # nesse dia (o registo faz-se depois de comer); antes da primeira janela, o pequeno-almoço.
  refeicoes:
    inicio:
      PEQUENO_ALMOCO: "07:00"
      ALMOCO: "12:00"
      LANCHE: "15:30"
      JANTAR: "18:30"
      CEIA: "21:00"
    poucas-seguidas: 3      # 3 refeições seguidas «Pouco» ou «Recusou» geram o alerta «Come pouco»
  # Hidratação: 3 momentos por dia, escala 0–3 (0 Nada, 1 Pouco, 2 Razoável, 3 Bem). Cada momento começa a esta hora.
  hidratacao:
    inicio:
      MANHA: "07:00"
      TARDE: "12:00"
      NOITE: "18:00"
  peso:
    perda-percentagem: 5    # perda de mais de 5 %
    perda-dias: 30          # em 30 dias: «Perda de peso — avisar enfermagem»
  vigilancia:
    intervalos-horas: [1, 4, 8, 24]   # verificações pós-queda: 1 h, 4 h, 8 h e 24 h depois da queda
    tolerancia-minutos: 30            # +30 min sem fazer: selo laranja na grelha
  demo:
    password: demo1234
