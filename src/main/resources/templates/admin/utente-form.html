<!DOCTYPE html>
<html lang="pt-PT" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/layout :: head(${utente == null ? 'Novo utente' : 'Editar utente'})}"></head>
<body>
<header th:replace="~{admin/layout :: topo(${menu})}"></header>
<main class="conteudo estreito">
    <h1 th:text="${utente == null} ? 'Novo utente' : 'Editar utente'">Utente</h1>

    <div class="alerta alerta-erro" th:if="${#fields.hasErrors('${form.*}')}" role="alert">
        <div th:each="e : ${#fields.errors('${form.*}')}" th:text="${e}"></div>
    </div>

    <form class="formulario" method="post" enctype="multipart/form-data"
          th:action="${utente == null} ? @{/admin/utentes} : @{/admin/utentes/{id}(id=${utente.id})}">
        <label>Nome
            <input type="text" name="nome" th:value="${form.nome}" maxlength="120" required autofocus>
        </label>
        <label>Quarto
            <input type="text" name="quarto" th:value="${form.quarto}" maxlength="10" required>
        </label>

        <fieldset class="emergencia">
            <legend>Dados para a ficha de emergência (INEM)</legend>
            <p class="suave pequeno">Opcionais. Aparecem na ficha de emergência em PDF; o que faltar fica assinalado como «não registado».</p>
            <label>Data de nascimento
                <input type="date" name="dataNascimento" th:value="${form.dataNascimento}" min="1900-01-01">
            </label>
            <label>Sexo
                <select name="sexo">
                    <option value="" th:selected="${form.sexo == null or form.sexo.isEmpty()}">Não indicado</option>
                    <option value="F" th:selected="${'F'.equals(form.sexo)}">Feminino</option>
                    <option value="M" th:selected="${'M'.equals(form.sexo)}">Masculino</option>
                </select>
            </label>
            <label>Número de utente do SNS
                <input type="text" name="numeroUtenteSns" th:value="${form.numeroUtenteSns}" maxlength="20" inputmode="numeric">
            </label>
            <label>Contacto de emergência — nome
                <input type="text" name="contactoNome" th:value="${form.contactoNome}" maxlength="120">
            </label>
            <label>Contacto de emergência — parentesco
                <input type="text" name="contactoParentesco" th:value="${form.contactoParentesco}" maxlength="60" placeholder="Filha, sobrinho…">
            </label>
            <label>Contacto de emergência — telefone
                <input type="tel" name="contactoTelefone" th:value="${form.contactoTelefone}" maxlength="30">
            </label>
            <label>Médico assistente / centro de saúde
                <input type="text" name="medicoAssistente" th:value="${form.medicoAssistente}" maxlength="120">
            </label>
            <label>Outras informações importantes para a equipa de emergência
                <textarea name="infoEmergencia" rows="4" maxlength="1000" th:text="${form.infoEmergencia}"
                          placeholder="Decisões já tomadas, diretivas, situações a ter em conta…"></textarea>
            </label>
        </fieldset>

        <div class="campo-foto">
            <img class="foto-previa" th:if="${utente != null}" th:src="@{/fotos/{id}(id=${utente.id})}" alt="Foto atual">
            <div>
                <label>Foto (JPG ou PNG)
                    <input type="file" name="foto" accept="image/png,image/jpeg">
                </label>
                <p class="suave pequeno">É recortada ao centro em quadrado. Sem foto, aparece um avatar com as iniciais.</p>
                <label class="checkbox" th:if="${temFoto}">
                    <input type="checkbox" name="removerFoto" value="true"> Remover a foto atual
                </label>
            </div>
        </div>

        <div class="barra">
            <button type="submit" class="botao">Guardar</button>
            <a class="botao botao-claro" href="/admin/utentes">Cancelar</a>
        </div>
    </form>
</main>
</body>
</html>
