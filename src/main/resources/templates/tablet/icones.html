<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!--
  Ícones SVG inline (sem dependências). Todos no mesmo estilo: grelha 24x24, traço de 2 px, pontas e cantos
  arredondados, sem preenchimento. A cor vem de "currentColor".
  Uso: <th:block th:replace="~{tablet/icones :: ic('banho')}"/>
-->
<svg th:fragment="ic(nome)" class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
    <!-- banho: gota -->
    <path th:if="${nome == 'banho'}" d="M12 3.2C9 7 6 10.2 6 14a6 6 0 0 0 12 0c0-3.8-3-7-6-10.8z"/>
    <!-- queda: triângulo de aviso -->
    <g th:if="${nome == 'queda'}"><path d="M12 3.5 2.8 19.5h18.4L12 3.5z"/><path d="M12 10v4.2"/><path d="M12 17.2h.01"/></g>
    <!-- dor / mal-estar: cruz -->
    <path th:if="${nome == 'dor'}" d="M9.5 3.5h5v6h6v5h-6v6h-5v-6h-6v-5h6v-6z"/>
    <!-- medicação: comprimido -->
    <g th:if="${nome == 'medicacao'}" transform="rotate(-45 12 12)"><rect x="2.5" y="7.5" width="19" height="9" rx="4.5"/><path d="M12 7.5v9"/></g>
    <!-- voltar -->
    <g th:if="${nome == 'voltar'}"><path d="M19.5 12h-15"/><path d="m11 5.5-6.5 6.5 6.5 6.5"/></g>
    <!-- feito -->
    <path th:if="${nome == 'ok'}" d="m4.5 12.5 5 5 10-11"/>
    <!-- nota: lápis -->
    <g th:if="${nome == 'nota'}"><path d="M4 20l1-4.2L16.6 4.2a2.1 2.1 0 0 1 3 3L8 18.8 4 20z"/><path d="m14.5 6.3 3 3"/></g>
    <!-- desfazer -->
    <g th:if="${nome == 'desfazer'}"><path d="M4.5 9h10a5 5 0 0 1 0 10H9"/><path d="M8.5 4.5 4.2 9l4.3 4.5"/></g>
    <!-- em atraso: relógio -->
    <g th:if="${nome == 'relogio'}"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></g>
    <!-- vigilância: olho (ícone próprio do selo laranja da grelha e do aviso) -->
    <g th:if="${nome == 'olho'}"><path d="M2.5 12s3.6-6.5 9.5-6.5 9.5 6.5 9.5 6.5-3.6 6.5-9.5 6.5S2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/></g>
    <!-- pendente: círculo vazio -->
    <circle th:if="${nome == 'pendente'}" cx="12" cy="12" r="8"/>
    <!-- alergia / aviso de segurança: losango com ponto de exclamação (forma própria: não se confunde com a queda) -->
    <g th:if="${nome == 'alergia'}"><path d="M12 2.8 21.2 12 12 21.2 2.8 12z"/><path d="M12 8v4.6"/><path d="M12 15.8h.01"/></g>
    <!-- mobilidade: pessoa -->
    <g th:if="${nome == 'pessoa'}"><circle cx="12" cy="5" r="2.2"/><path d="M12 8.5v6"/><path d="m12 14.5-3 6"/><path d="m12 14.5 3 6"/><path d="M7.5 11.5h9"/></g>
    <!-- risco de queda: barras de nível -->
    <g th:if="${nome == 'risco'}"><path d="M5 20v-4"/><path d="M12 20v-9"/><path d="M19 20V4"/></g>
    <!-- alimentação: talheres -->
    <g th:if="${nome == 'comida'}"><path d="M5.5 3v6.5a2.5 2.5 0 0 0 5 0V3"/><path d="M8 3v18"/><path d="M17 21V3c-2.6 1.4-3.6 4-3.6 7.4V14H17"/></g>
    <!-- ouvido -->
    <g th:if="${nome == 'ouvido'}"><path d="M7 9.5a5 5 0 0 1 10 0c0 3.2-3 3.6-3 6.5a2.6 2.6 0 0 1-5.2 0"/><path d="M10 9.5a2 2 0 0 1 4 0"/></g>
    <!-- óculos -->
    <g th:if="${nome == 'oculos'}"><circle cx="6.5" cy="14" r="3.5"/><circle cx="17.5" cy="14" r="3.5"/><path d="M10 14h4"/><path d="M3 14l1.5-7"/><path d="M21 14l-1.5-7"/></g>
    <!-- dentes -->
    <path th:if="${nome == 'dentes'}" d="M8 3.5c-2.5 0-4 2-4 4.5 0 3 1.5 4 2 7l.8 5.5h1.7l.5-5.5h5l.5 5.5h1.7l.8-5.5c.5-3 2-4 2-7 0-2.5-1.5-4.5-4-4.5-1.5 0-2.3.7-4 .7S9.5 3.5 8 3.5z"/>
    <!-- desorientado: ponto de interrogação -->
    <g th:if="${nome == 'desorientado'}"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.6a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .9-1 1.7"/><path d="M12 17h.01"/></g>
    <!-- aviso especial / informação -->
    <g th:if="${nome == 'info'}"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5"/><path d="M12 7.6h.01"/></g>
    <!-- conversa -->
    <path th:if="${nome == 'conversa'}" d="M4 5h16v11H9.5L4 20.5V5z"/>
    <!-- quantidade da refeição: prato cheio, a meio, quase vazio, recusou (cruz) -->
    <g th:if="${nome == 'prato-tudo'}"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5.6" fill="currentColor"/></g>
    <g th:if="${nome == 'prato-metade'}"><circle cx="12" cy="12" r="9"/><path d="M12 6.4a5.6 5.6 0 0 1 0 11.2z" fill="currentColor"/></g>
    <g th:if="${nome == 'prato-pouco'}"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="1.9" fill="currentColor"/></g>
    <g th:if="${nome == 'prato-recusou'}"><circle cx="12" cy="12" r="9"/><path d="m8.6 8.6 6.8 6.8"/><path d="m15.4 8.6-6.8 6.8"/></g>
    <!-- apagar (tecla): seta para a esquerda com cruz -->
    <g th:if="${nome == 'apagar'}"><path d="M9 5h11a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H9l-6-7z"/><path d="m12.5 9.5 5 5"/><path d="m17.5 9.5-5 5"/></g>
    <!-- sair: porta com seta -->
    <g th:if="${nome == 'sair'}"><path d="M10 4.5H6a1 1 0 0 0-1 1v13a1 1 0 0 0 1 1h4"/><path d="M15 8l4 4-4 4"/><path d="M19 12H9.5"/></g>
    <!-- marca do lar: casa com coração -->
    <g th:if="${nome == 'casa'}"><path d="M3.5 11 12 4l8.5 7"/><path d="M5.5 9.7V20h13V9.7"/><path d="M12 16.6s-3-1.8-3-3.7a1.7 1.7 0 0 1 3-1.1 1.7 1.7 0 0 1 3 1.1c0 1.9-3 3.7-3 3.7z"/></g>
</svg>
</body>
</html>
